<link href="styles.css" rel="stylesheet" />

<h1>Build the /tools pages</h1>

<p class="lede">
  Creates the shared classes, then inserts each page body into that page&rsquo;s
  <code>page_main</code> as native Webflow elements.
</p>

<button id="build" type="button">Build all four pages</button>

<p class="hint">Or build one at a time:</p>
<ul id="pages" class="pages"></ul>

<p class="hint">
  A page whose <code>page_main</code> already has children is skipped rather than
  appended to, so running this twice will not duplicate anything.
</p>

<label class="check">
  <input id="replace" type="checkbox" />
  <span>
    <strong>Replace existing content.</strong>
    Deletes whatever is already in <code>page_main</code> first, then rebuilds.
    Use this to re-apply after the page bodies change. There is no undo.
  </span>
</label>

<ul id="log" class="log" aria-live="polite"></ul>

<script type="module" src="index.js"></script>
