  - main [ref=f12e57]:
    - generic [ref=f12e60]:
      - paragraph [ref=f12e61]: Free tools · No overlay widget, ever
      - heading "Accessibility checker for Webflow sites" [level=1] [ref=f12e62]
      - paragraph [ref=f12e63]: Scan any page against WCAG 2.1 and 2.2 Level AA, see which accessibility laws apply to the markets you sell into, and get the exact fix for each issue written as Webflow Designer steps rather than generic developer output. Automated scanning covers roughly a third of the WCAG success criteria, so this finds real problems and tells you plainly what it cannot check.
    - generic [ref=f12e65]:
      - heading "The tools" [level=2] [ref=f12e66]
      - generic [ref=f12e67]:
        - heading "Colour contrast checker" [level=3] [ref=f12e68]
        - paragraph [ref=f12e69]: Any foreground and background pair against AA and AAA, plus a palette sweep that flags every failing combination in a brand system. Runs in your browser, needs no email, and has no limit.
        - heading "WCAG 2.1 and 2.2 scanner" [level=3] [ref=f12e70]
        - paragraph [ref=f12e71]: "A full page audit with severity, the success criterion at fault, and the element that broke it. Built on axe-core, with three additional checks for criteria axe has no rule for: focus visibility, focus obscured by sticky headers, and real text clipping at 200% zoom."
        - heading "Webflow remediation steps" [level=3] [ref=f12e72]
        - paragraph [ref=f12e73]: "Each issue mapped to the panel, class and setting in Webflow Designer that fixes it. Where an element sits inside a Collection List we say so, because the fix belongs on the CMS field: change the element and only the first item changes, and the next publish overwrites it."
        - heading "Jurisdiction mapper" [level=3] [ref=f12e74]
        - paragraph [ref=f12e75]: Pick the markets you sell into and see which regimes bind you, with the deadline and the standard for each. A planning aid, not legal advice.
        - heading "Accessibility statement and VPAT drafts" [level=3] [ref=f12e76]
        - paragraph [ref=f12e77]: The statement the European Accessibility Act requires, and a VPAT 2.5 draft for procurement, both populated from your own scan so the known-issues section stays honest.
    - generic [ref=f12e80]:
      - heading "What this tool does not do" [level=2] [ref=f12e81]
      - paragraph [ref=f12e82]: "No scanner can confirm that a page is compliant, and any tool that says otherwise is selling you something. Roughly two thirds of the WCAG success criteria need a human to judge them: reading order, whether alt text is meaningful, error recovery, and whether a keyboard user can actually finish the task."
      - paragraph [ref=f12e83]: We tell you exactly which criteria were tested, which were not, and what a manual audit would add. Every report carries that figure.
      - paragraph [ref=f12e84]: We also do not build, sell or recommend accessibility overlay widgets. Overlay vendors are being sued, and a one-line script cannot fix a heading order or write meaningful alt text. This is an audit and remediation tool, and that is all it claims to be.
      - link "Talk to us about remediation" [ref=f12e85] [cursor=pointer]:
        - /url: /contact-us
