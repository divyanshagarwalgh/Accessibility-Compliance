    - paragraph [ref=f21e71]: Meeting WCAG 2.2 AA satisfies every row above. Each version is a superset of the one before it, apart from a single criterion that WCAG 2.2 withdrew, so building to the newest standard is simpler than tracking which regime wants which vintage.
  - generic [ref=f21e73]:
    - heading "Three things businesses get wrong" [level=2] [ref=f21e74]
    - generic [ref=f21e75]:
      - generic [ref=f21e76]:
        - heading "“We are not in the EU”" [level=3] [ref=f21e77]
        - paragraph [ref=f21e78]: The European Accessibility Act binds the offering, not the seller's address. If you sell to EU consumers you are in scope, and an accessibility statement is mandatory.
      - generic [ref=f21e79]:
        - heading "“We will certify”" [level=3] [ref=f21e80]
        - paragraph [ref=f21e81]: There is no certification for the ADA and no safe harbour. Enforcement is private litigation. Nobody can sell you a badge that ends the exposure, and anyone offering one is selling something else.
      - generic [ref=f21e82]:
        - heading "“An overlay covers it”" [level=3] [ref=f21e83]
        - paragraph [ref=f21e84]: Overlay vendors are being sued. Installing one is a matter of public record that plaintiffs search for, and the products are widely rejected by the disabled users they claim to serve.
  - generic [ref=f21e86]:
    - heading "The dates that matter" [level=2] [ref=f21e87]
    - generic [ref=f21e88]:
      - paragraph [ref=f21e89]:
        - strong [ref=f21e90]: 28 June 2025
        - text: — the European Accessibility Act became enforceable. It is past, not upcoming, and it binds any business selling to EU consumers regardless of where it is based.
      - paragraph [ref=f21e91]:
        - strong [ref=f21e92]: 26 April 2027
        - text: — ADA Title II compliance deadline for public entities serving 50,000 people or more.
      - paragraph [ref=f21e93]:
        - strong [ref=f21e94]: 26 April 2028
        - text: — the same deadline for smaller public entities.
      - paragraph [ref=f21e95]: The enforcement picture changed in June 2026, when a French court ordered Carrefour to reach full compliance under a EUR 500 per day penalty and explicitly rejected a 71% conformance score as sufficient. Partial compliance is not a legal position.
    - generic [ref=f21e96]:
      - heading "This is a planning aid, not legal advice" [level=3] [ref=f21e97]
      - paragraph [ref=f21e98]: "The mapping is generated from the markets you select and is meant for planning what to build and in what order. It is not legal advice, it does not account for your sector's specific obligations, and it cannot tell you how a court would rule. Have the wording reviewed by counsel before you rely on it. Separately: our scan evaluates 12 of the 55 WCAG 2.2 Level A and AA success criteria, so no result from it establishes compliance with any regime on this page."
  - generic [ref=f21e100]:
    - heading "Questions" [level=2] [ref=f21e101]
    - generic [ref=f21e102]:
      - heading "Which standard should we build to?" [level=3] [ref=f21e103] [cursor=pointer]
      - paragraph [ref=f21e104]: WCAG 2.2 level AA. It is the newest, it satisfies every regime listed above, and building to the strictest baseline once is cheaper than re-auditing each time a regulator adopts a newer version.
    - generic [ref=f21e105]:
      - heading "Does any of this apply to a small business?" [level=3] [ref=f21e106] [cursor=pointer]
      - paragraph [ref=f21e107]: ADA Title III has no employee threshold, so size is not a defence in the US. The EAA does exempt microenterprises — fewer than 10 people and under EUR 2 million turnover — from some obligations, but the exemption is narrower than most people assume and does not extend to everything.
    - generic [ref=f21e108]:
      - heading "How likely is enforcement, really?" [level=3] [ref=f21e109] [cursor=pointer]
      - paragraph [ref=f21e110]: In the US, thousands of web accessibility suits are filed annually, concentrated in retail and hospitality. In the EU, enforcement is newer and the Carrefour ruling suggests courts are willing to order full remediation with daily penalties. WebAIM's 2026 study found 95.9% of the top million homepages fail, which means the constraint on enforcement is attention, not eligibility.