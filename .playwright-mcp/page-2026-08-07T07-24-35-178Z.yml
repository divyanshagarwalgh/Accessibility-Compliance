        - paragraph [ref=f5e49]: "No scanner can confirm that a page is compliant, and any tool that says otherwise is selling you something. Roughly two thirds of the success criteria need a human to judge them: reading order, meaningful alt text, error recovery, and whether a keyboard user can actually finish the task. Every report here tells you which criteria were tested and which were not."
