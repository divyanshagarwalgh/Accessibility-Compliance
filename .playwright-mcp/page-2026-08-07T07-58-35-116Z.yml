    - heading "WCAG compliance checker" [level=1] [ref=f18e5]
    - paragraph [ref=f18e6]: Enter a URL and get every WCAG 2.2 Level A and AA failure a machine can find, each one mapped to the exact fix in Webflow Designer rather than to a line of HTML you cannot edit. Free, no account, and the score is public so you can share it.
